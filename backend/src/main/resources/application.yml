# 密码和微信密钥必须通过环境变量提供，不写入仓库。
server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/word_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:word_db}
    password: ${DB_PASSWORD}
wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}
