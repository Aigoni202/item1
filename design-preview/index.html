<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贝贝单词 · 界面设计预览</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212e;background:#eaf0f7}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;transition:transform .15s ease,opacity .15s ease}button:active{transform:scale(.97)}
    .shell{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px;min-height:100vh}
    .rail{width:210px;flex:none;position:sticky;top:24px}.rail h1{font-size:20px;margin:0 0 6px}.rail p{color:#687789;font-size:12px;margin:0 0 16px}.rail button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:10px 12px;color:#435266}.rail button.active{background:#dceaff;color:#075bb9;font-weight:700}
    .phone{width:390px;max-width:100%;height:844px;flex:none;background:#fff;border-radius:24px;box-shadow:0 18px 60px #223a5a22;overflow:hidden;display:flex;flex-direction:column}
    .screen{flex:1;overflow:auto;padding:28px 22px 22px;transition:opacity .12s ease,transform .12s ease}.screen.leaving{opacity:0;transform:translateY(-5px)}.screen>*{animation:arrive .22s ease both}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.screen:empty{display:none}.tabs{display:flex;justify-content:space-around;border-top:1px solid #e4eaf1;padding:9px 0 13px;background:#fff}.tabs button{border:0;background:none;color:#718091;font-size:12px;min-width:64px;padding:6px}.tabs button.active{color:#0969da;font-weight:700}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:24px}.eyebrow{font-size:12px;color:#0969da;font-weight:700;letter-spacing:.06em}.title{font-size:25px;line-height:1.25;font-weight:750;margin:6px 0 0}.sub{font-size:13px;color:#6b7888;line-height:1.5;margin:7px 0 0}.seg{display:flex;gap:4px;padding:4px;border-radius:11px;background:#eef3f9}.seg button{border:0;border-radius:8px;background:none;color:#65758a;padding:7px 10px;font-size:12px}.seg button.active{background:#0969da;color:white}
    .hero{background:#eaf3ff;border-radius:20px;padding:22px;margin-bottom:22px}.hero h2{font-size:21px;margin:0 0 8px}.hero p{color:#4a607a;font-size:13px;line-height:1.5;margin:0 0 18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.metrics{display:flex;gap:8px;margin:18px 0}.metric{flex:1;background:#fff;border-radius:11px;padding:12px 8px;text-align:center}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:#667689}.primary,.secondary{border-radius:11px;padding:12px 14px;border:1px solid #0969da;font-weight:700;transition:transform .15s,opacity .2s}.primary{color:white;background:#0969da}.secondary{color:#0969da;background:#fff}.wide{width:100%}.muted{color:#687789}.section{font-size:17px;margin:24px 0 12px}.list{border-top:1px solid #e5eaf0}.item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid #e5eaf0;background:#fff;text-align:left;padding:16px 2px;color:inherit}.item strong{font-size:15px}.item small{display:block;font-size:12px;color:#687789;margin-top:5px}.arrow{font-size:18px;color:#8a99aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid #dce5f0;background:#fff;border-radius:15px;text-align:left;padding:16px;min-height:110px}.tile strong{display:block;font-size:15px}.tile small{display:block;color:#6b7888;margin-top:8px;line-height:1.45}.chip{display:inline-block;border-radius:50px;background:#e9f2ff;color:#0969da;padding:5px 10px;font-size:11px;font-weight:700}.note{font-size:12px;color:#748192;line-height:1.5;margin:15px 0}.word{font-size:47px;font-weight:750;text-align:center;margin:54px 0 5px}.phonetic{text-align:center;color:#687789;font-size:16px}.meaning{text-align:center;font-size:25px;font-weight:700;margin:48px 0 36px}.progress{height:7px;background:#e8edf4;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#0969da;border-radius:9px}.actions{display:flex;gap:9px}.actions button{flex:1}.answer{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dce5f0;border-radius:12px;padding:16px;margin:10px 0}.answer.selected{background:#eaf3ff;border-color:#0969da}.bubble{max-width:82%;border-radius:15px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5;background:#eef3f9}.bubble.me{margin-left:auto;background:#e2f0ff}.field{width:100%;border:1px solid #d5e0eb;border-radius:11px;padding:13px;margin:8px 0 15px;background:white}.stack>*+*{margin-top:10px}.back{border:0;background:none;color:#0969da;padding:0;margin-bottom:16px;font-size:14px}.foot{margin-top:25px}
    @media(max-width:680px){.shell{padding:0;display:block}.rail{position:static;width:auto;padding:14px 16px;background:#eaf0f7}.rail h1,.rail p{display:none}.rail nav{display:flex;overflow:auto;gap:4px}.rail button{white-space:nowrap;width:auto;font-size:12px}.phone{width:100%;height:calc(100dvh - 55px);border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail"><h1>贝贝单词</h1><p>全流程 UI 设计预览 · 内容均为演示数据</p><nav id="nav"></nav></aside>
    <div class="phone"><main class="screen" id="screen"></main><footer class="tabs" id="tabs"></footer></div>
  </div>
  <script>
    const names={home:'首页',study:'学习',wordbook:'词库',card:'单词卡',saved:'生词本',wrong:'错题本',pk:'好友 PK',pkGame:'PK 答题',pkResult:'PK 结果',ai:'AI 学习',explain:'单词讲解',diagnosis:'错词诊断',plan:'学习计划',daily:'每日任务',dialogue:'情景对话',history:'对话历史',mine:'我的'};
    const tabs=['home','study','ai','mine'];let current='home',level=4,answer=-1;
    const go=k=>{const screen=document.getElementById('screen');screen.classList.add('leaving');setTimeout(()=>{current=k;answer=-1;render();screen.classList.remove('leaving')},120)};const back=k=>`<button class="back" onclick="go('${k}')">‹ 返回</button>`;
    const headerView=(label,title,sub)=>`<div class="top"><div><div class="eyebrow">${label}</div><div class="title">${title}</div><p class="sub">${sub}</p></div></div>`;
    const item=(title,desc,k)=>`<button class="item" onclick="go('${k}')"><span><strong>${title}</strong><small>${desc}</small></span><span class="arrow">›</span></button>`;
    const tile=(title,desc,k)=>`<button class="tile" onclick="go('${k}')"><strong>${title}</strong><small>${desc}</small></button>`;
    const views={
      home:()=>`${headerView('BEIBEI WORDS','今天学一点','每天的任务，从这里开始')}<div class="seg" style="width:max-content;margin-bottom:18px"><button class="${level===4?'active':''}" onclick="level=4;render()">四级</button><button class="${level===6?'active':''}" onclick="level=6;render()">六级</button></div><div class="hero"><span class="chip">CET-${level} · 今日任务</span><h2 style="margin-top:13px">继续你的词汇学习</h2><p>任务数字为设计演示。正式版由学习记录计算。</p><div class="metrics"><div class="metric"><b>20</b><span>新词</span></div><div class="metric"><b>12</b><span>待复习</span></div><div class="metric"><b>5</b><span>错词</span></div></div><button class="primary wide" onclick="go('daily')">开始今日学习</button></div><h3 class="section">常用入口</h3><div class="grid">${tile('词库','浏览四级、六级词汇','wordbook')}${tile('错题本','复习答错的单词','wrong')}${tile('生词本','查看收藏的单词','saved')}${tile('好友 PK','邀请好友对战','pk')}</div>`,
      study:()=>`${headerView('STUDY','学习','按今天的节奏，完成新词与复习')}<div class="hero"><h2>今日进度 12 / 37</h2><p>完成新词 8 个，复习 4 个</p><div class="progress"><i style="width:32%"></i></div><div class="foot"><button class="primary wide" onclick="go('daily')">继续任务</button></div></div><h3 class="section">学习方式</h3><div class="list">${item('学新词','从当前词书继续','card')}${item('复习单词','查看到期待复习词','daily')}${item('错题本','查看和复习原有错词','wrong')}${item('生词本','查看原有收藏','saved')}${item('词库','查找单词','wordbook')}${item('闯关练习','沿用现有练习流程','pkGame')}</div>`,
      wordbook:()=>`${back('study')}${headerView('WORD BOOK',`CET-${level} 词库`,'查找、收藏或开始学习')}<input class="field" placeholder="搜索单词" aria-label="搜索单词"><div class="seg" style="margin-bottom:16px"><button class="${level===4?'active':''}" onclick="level=4;render()">四级</button><button class="${level===6?'active':''}" onclick="level=6;render()">六级</button></div><div class="list">${item('abandon','/əˈbændən/ · 放弃；抛弃','card')}${item('ability','/əˈbɪləti/ · 能力','card')}${item('accurate','/ˈækjərət/ · 准确的','card')}${item('achieve','/əˈtʃiːv/ · 达成','card')}</div>`,
      card:()=>`${back('study')}<div class="row"><span class="chip">CET-${level}</span><span class="muted" style="font-size:12px">1 / 20</span></div><div class="word">abandon</div><div class="phonetic">/əˈbændən/</div><div class="meaning">v. 放弃；抛弃</div><div class="actions"><button class="secondary" onclick="this.textContent=this.textContent==='收藏'?'已收藏':'收藏'">收藏</button><button class="primary" onclick="go('explain')">AI 深度讲解</button></div><div class="foot"><button class="secondary wide" onclick="go('card')">下一个单词</button></div><p class="note">讲解内容在正式版由服务端生成；词和音标取自原词库。</p>`,
      saved:()=>`${back('study')}${headerView('SAVED','生词本','你主动收藏的单词')}<div class="list">${item('abandon','v. 放弃；抛弃','card')}${item('accurate','adj. 准确的','card')}</div><p class="note">保留原有收藏、查看和移除流程。</p>`,
      wrong:()=>`${back('study')}${headerView('WRONG WORDS','错题本','复习答错的单词')}<div class="row"><span class="chip">全部</span><button class="secondary" onclick="go('diagnosis')">AI 诊断</button></div><div class="list" style="margin-top:15px">${item('affect','待加强 · 词义易混','card')}${item('effect','待加强 · 词性易混','card')}${item('abandon','已标记掌握','card')}</div><p class="note">原有查看、复习、标记掌握和移除仍保留。</p>`,
      pk:()=>`${back('home')}${headerView('FRIEND PK','好友 PK','现有房间与规则保持不变')}<div class="hero"><h2>创建房间</h2><p>从当前 CET-${level} 词库出题，邀请好友对战。</p><button class="primary wide" onclick="go('pkGame')">创建房间 · 进入演示</button></div><h3 class="section">加入好友房间</h3><input class="field" placeholder="输入 6 位房间号" inputmode="numeric"><button class="secondary wide" onclick="go('pkGame')">加入房间 · 进入演示</button>`,
      pkGame:()=>`${back('pk')}<div class="row"><span class="chip">好友 PK · CET-${level}</span><span class="muted">第 1 / 20 题</span></div><div class="word" style="margin-top:65px">affect</div><p class="sub" style="text-align:center;margin-bottom:35px">选择正确的中文释义</p>${['影响','效果','放弃','获得'].map((v,i)=>`<button class="answer ${answer===i?'selected':''}" onclick="answer=${i};render()">${String.fromCharCode(65+i)}　${v}</button>`).join('')}<div class="foot"><button class="primary wide" onclick="go('pkResult')">提交答案 · 查看结果</button></div>`,
      pkResult:()=>`${back('pk')}${headerView('RESULT','本局结束','好友 PK 结果演示')}<div class="hero"><h2>12 : 10</h2><p>本局答错的词仍进入原错题本。</p><button class="primary wide" onclick="go('wrong')">查看错题</button></div><button class="secondary wide" onclick="go('pk')">再来一局</button>`,
      ai:()=>`${headerView('AI STUDY','AI 学习','围绕真实学习记录给出帮助')}<div class="hero"><h2>从一个词开始</h2><p>用讲解、例句和易混辨析理解单词。</p><button class="primary wide" onclick="go('explain')">查看单词讲解</button></div><div class="list">${item('错词诊断','分析易混词和薄弱点','diagnosis')}${item('个性化学习计划','按目标安排每日任务','plan')}${item('情景对话','练习使用已学词汇','dialogue')}${item('对话历史','回看练习与建议','history')}</div>`,
      explain:()=>`${back('ai')}${headerView('AI EXPLAIN','abandon','/əˈbændən/ · v. 放弃；抛弃')}<span class="chip">词库：CET-${level}</span><h3 class="section">怎么记</h3><p class="sub">将词义与“放弃某事”的具体语境联系起来。</p><h3 class="section">常见搭配</h3><div class="list"><div class="item">abandon a plan　放弃计划</div><div class="item">abandon hope　放弃希望</div></div><h3 class="section">考试语境</h3><p class="sub">The project was abandoned after the test.<br>测试后，这个项目被放弃了。</p><p class="note">页面文案是视觉演示，正式 AI 内容必须经结构校验，音标和词级以词库为准。</p>`,
      diagnosis:()=>`${back('ai')}${headerView('AI DIAGNOSIS','错词诊断','用答题证据发现薄弱点')}<div class="metrics"><div class="metric"><b>18</b><span>错词</span></div><div class="metric"><b>6</b><span>反复出错</span></div><div class="metric"><b>4</b><span>已掌握</span></div></div><h3 class="section">重点辨析</h3><div class="hero"><h2>affect / effect</h2><p>容易混淆词性和含义。建议先做 5 道针对性练习。</p><button class="primary wide" onclick="go('daily')">开始专项练习</button></div><p class="note">统计为演示数据；正式版按学习、闯关、PK 来源分别统计。</p>`,
      plan:()=>`${back('ai')}${headerView('STUDY PLAN','学习计划','先设置目标，再生成任务')}<label>备考目标</label><div class="seg" style="margin:9px 0 16px"><button class="${level===4?'active':''}" onclick="level=4;render()">CET-4</button><button class="${level===6?'active':''}" onclick="level=6;render()">CET-6</button></div><label>预计考试日期</label><input class="field" type="date"><label>每天可用时间</label><select class="field"><option>20 分钟</option><option>30 分钟</option><option>45 分钟</option></select><button class="primary wide" onclick="go('daily')">预览每日任务</button><p class="note">修改目标时会先确认，不覆盖历史学习记录。</p>`,
      daily:()=>`${back('study')}${headerView('TODAY','今日任务','按顺序完成，随时可以暂停')}<div class="list">${item('新词学习 · 20 个','尚未开始','card')}${item('复习到期词 · 12 个','尚未开始','card')}${item('错词强化 · 5 个','尚未开始','wrong')}</div><p class="note">任务数量与完成状态在正式版由服务端学习记录计算。</p>`,
      dialogue:()=>`${back('ai')}${headerView('DIALOGUE','情景对话','校园生活 · CET-'+level)}<div class="bubble">Hi! Are you preparing for the English exam?</div><div class="bubble me">Yes. I am learning new words every day.</div><div class="bubble">That sounds like a good plan. Which words did you learn today?</div><div class="foot"><input class="field" placeholder="用英语回复"><button class="primary wide" onclick="go('history')">结束对话 · 查看总结</button></div>`,
      history:()=>`${back('ai')}${headerView('HISTORY','对话记录','查看过去练习和学习建议')}<div class="list">${item('校园生活 · CET-4','练习总结：表达清楚，可补充搭配','dialogue')}${item('科技发展 · CET-6','练习总结：注意词性选择','dialogue')}</div>`,
      mine:()=>`${headerView('PROFILE','我的','学习资料与进度')}<div class="hero"><h2>微信用户</h2><p>当前词书 CET-${level} · 以下统计为演示数据</p><div class="metrics"><div class="metric"><b>126</b><span>已学</span></div><div class="metric"><b>18</b><span>错词</span></div><div class="metric"><b>32</b><span>收藏</span></div></div></div><div class="list">${item('学习计划','查看和调整目标','plan')}${item('生词本','查看原有收藏','saved')}${item('错题本','查看原有错词','wrong')}${item('PK 记录','查看对战结果','pkResult')}</div>`
    };
    function render(){document.getElementById('screen').innerHTML=views[current]();document.getElementById('nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');document.getElementById('tabs').innerHTML=tabs.map(k=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${names[k]}</button>`).join('')}
    render();
  </script>
</body>
</html>
